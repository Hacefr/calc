<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>404 Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 404 Fake Page */
    #page-container {
      text-align: center;
      max-width: 520px;
      padding: 20px;
    }

    h1 {
      font-size: 5rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 0.5rem;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #f0f6fc;
    }

    p {
      color: #8b949e;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .decoy-btn {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }
    .decoy-btn:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    .decoy-btn.github-btn {
      background-color: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #ffffff;
      font-weight: 500;
    }
    .decoy-btn.github-btn:hover {
      background-color: #2ea043;
    }

    /* Secret ? Button (Bottom Left) */
    #secret-btn {
      position: fixed;
      bottom: 12px;
      left: 12px;
      width: 24px;
      height: 24px;
      background: transparent;
      border: 1px solid #30363d;
      color: #484f58;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, color 0.2s;
      user-select: none;
    }
    #secret-btn:hover {
      color: #8b949e;
      border-color: #8b949e;
    }

    /* Subtle loading animation */
    @keyframes discrete-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .loading-state {
      animation: discrete-pulse 1.2s infinite ease-in-out;
      cursor: default !important;
      border-color: #30363d !important;
      color: #58a6ff !important;
    }

    /* 100% RAW Decoy Modal */
    #calc-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      color: #000000;
      padding: 16px;
      border: 2px solid #000000;
      font-family: monospace;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 404 Disguise -->
  <div id="page-container">
    <h1>404</h1>
    <h2>File or directory not found.</h2>
    <p>The resource you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    
    <div class="button-group">
      <button class="decoy-btn" id="testRawBtn">Test raw fallback project</button>
      <a href="https://github.com" class="decoy-btn github-btn">Go back to GitHub</a>
    </div>
  </div>

  <!-- Discrete Secret Trigger -->
  <button id="secret-btn" title="Help">?</button>

  <!-- 100% RAW Unstyled HTML Calculator -->
  <div id="calc-modal">
    <h3>raw_calc_fallback.html</h3>
    <br>
    <input type="text" id="calc-screen" value="0" size="18" readonly>
    <br><br>
    <div>
      <button onclick="calcClear()">C</button>
      <button onclick="calcInput('/')">/</button>
      <button onclick="calcInput('*')">*</button>
      <button onclick="calcInput('-')">-</button>
    </div>
    <div>
      <button onclick="calcInput('7')">7</button>
      <button onclick="calcInput('8')">8</button>
      <button onclick="calcInput('9')">9</button>
      <button onclick="calcInput('+')">+</button>
    </div>
    <div>
      <button onclick="calcInput('4')">4</button>
      <button onclick="calcInput('5')">5</button>
      <button onclick="calcInput('6')">6</button>
      <button onclick="calcEqual()">=</button>
    </div>
    <div>
      <button onclick="calcInput('1')">1</button>
      <button onclick="calcInput('2')">2</button>
      <button onclick="calcInput('3')">3</button>
      <button onclick="calcInput('0')">0</button>
      <button onclick="calcInput('.')">.</button>
    </div>
    <br>
    <button id="calcClose">[ Close Window ]</button>
  </div>

  <script>
    // Updated Direct Dropbox Link
    const TARGET_URL = 'https://dl.dropboxusercontent.com/scl/fi/rg0vnn3ju44frx4s9y8tn/Launch.html?rlkey=s063qyihs6wqcekpb0jmkiwq2&st=mt7j6equ';

    // 1. Calculator Decoy Logic
    const calcModal = document.getElementById('calc-modal');
    const screen = document.getElementById('calc-screen');

    document.getElementById('testRawBtn').addEventListener('click', () => {
      calcModal.style.display = 'block';
    });

    document.getElementById('calcClose').addEventListener('click', () => {
      calcModal.style.display = 'none';
    });

    function calcInput(val) {
      if (screen.value === '0' && val !== '.') {
        screen.value = val;
      } else {
        screen.value += val;
      }
    }

    function calcClear() {
      screen.value = '0';
    }

    function calcEqual() {
      try {
        screen.value = Function('"use strict";return (' + screen.value + ')')();
      } catch {
        screen.value = 'Error';
      }
    }

    // 2. Secret about:blank Launcher
    const secretBtn = document.getElementById('secret-btn');
    let isFetching = false;

    secretBtn.addEventListener('click', async () => {
      if (isFetching) return;
      
      isFetching = true;
      secretBtn.textContent = '·';
      secretBtn.classList.add('loading-state');

      // Instantly open the about:blank tab
      const blankWindow = window.open('about:blank', '_blank');
      
      if (!blankWindow) {
        alert('Please allow popups to launch.');
        isFetching = false;
        secretBtn.textContent = '?';
        secretBtn.classList.remove('loading-state');
        return;
      }

      blankWindow.document.write('<p style="font-family:sans-serif;color:#888;padding:20px;">Loading...</p>');

      try {
        // Fetch raw HTML from Dropbox
        const res = await fetch(TARGET_URL);
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        const html = await res.text();

        // Inject and run directly in about:blank
        blankWindow.document.open();
        blankWindow.document.write(html);
        blankWindow.document.close();

      } catch (err) {
        console.error('Fetch failed:', err);
        blankWindow.document.write('<p style="color:red;padding:20px;">Failed to load raw data.</p>');
      } finally {
        isFetching = false;
        secretBtn.textContent = '?';
        secretBtn.classList.remove('loading-state');
      }
    });
  </script>
</body>
</html>
